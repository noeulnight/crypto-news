[package]
name = "crypto-news"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = "0.4.45"
dotenvy = "0.15.7"
futures-util = { version = "0.3.34", features = ["sink"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json", "gzip"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
rustls = "0.23.46"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
